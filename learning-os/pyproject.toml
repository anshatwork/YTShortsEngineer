[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-os"
version = "0.0.0"
description = "AI Learning OS — event-sourced services that turn saved content into a per-user knowledge graph."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "nats-py>=2.6",
  "asyncpg>=0.29",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "anyio>=4",
]

# The importable package is `los` (the on-disk dir `learning-os/` has a hyphen and is not importable).
[tool.setuptools.packages.find]
include = ["los*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
